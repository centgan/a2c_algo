name: tensor-nvidia
channels:
  - conda-forge
  - nvidia
  - defaults
dependencies:
  - python=3.10.16
  - pip
  - setuptools
  - wheel

  # ── CUDA 12.3 toolkit (matches TensorFlow 2.17's bundled CUDA) ──
  - cuda-toolkit=12.3
  - cudnn=8.9

  # ── System libs ──
  - bzip2
  - libffi
  - ncurses
  - openssl
  - readline
  - sqlite
  - tk
  - xz
  - zlib

  - pip:
      # ── TensorFlow GPU stack ──
      # TF 2.17 ships with built-in CUDA 12.3 support via pip.
      # Do NOT install tensorflow-metal here — that is Apple-only.
      - tensorflow[and-cuda]==2.17.0
      - tensorflow-probability==0.24.0
      - tf-keras==2.17.0

      # ── Core ML / math ──
      - numpy==2.2.6
      - scipy==1.15.3
      - pandas==2.2.3
      - pyarrow==20.0.0

      # ── Visualization ──
      - matplotlib==3.10.0
      - pillow==11.1.0
      - opencv-python==4.12.0.88

      # ── Logging / progress ──
      - loguru==0.7.3
      - tqdm==4.67.1
      - rich==13.9.4

      # ── TensorBoard ──
      - tensorboard==2.17.1

      # ── Other (carried over from original env) ──
      - h5py==3.12.1
      - requests==2.32.3
      - cloudpickle==3.1.0
